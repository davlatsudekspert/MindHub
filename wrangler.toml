name = "mindhubuz"
main = "worker/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
# JS/CSS should never be cached at the edge so new deploys reach users
# immediately (mirrors server.js's Cache-Control: no-cache for .js/.css).
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "mindhubuz"
database_id = "6775125a-fe4f-4c40-bbcc-33c5c9747bdd"
migrations_dir = "migrations/d1"

[[r2_buckets]]
binding = "R2"
bucket_name = "mindhubuz-uploads"

[[durable_objects.bindings]]
name = "WSHUB"
class_name = "WsHub"

[[migrations]]
tag = "v1"
new_classes = ["WsHub"]

# Cron trigger — AI klasterlash navbatini qayta ishlash (ai_jobs jadvali).
# Node versiyasida setInterval bilan har 5 soniyada tekshirilardi; Workers'da
# doimiy background process yo'q, shuning uchun eng qisqa mumkin bo'lgan
# cron interval (1 daqiqa) ishlatiladi. AI_PROVIDER o'rnatilmasa (default),
# bu handler zudlik bilan hech narsa qilmasdan chiqadi (feature flag).
[triggers]
crons = ["*/1 * * * *"]

[vars]
# Maxfiy qiymatlar (SECRET, AI_API_KEY, RESEND_API_KEY va h.k.) bu yerga
# YOZILMAYDI — ular `wrangler secret put NOM` orqali alohida saqlanadi.
# ⚠️ Haqiqiy URL manzilingiz `mindhubuz.<sizning-subdomeningiz>.workers.dev`
# shaklida bo'ladi (subdomen — Cloudflare hisobingizga bog'liq, `wrangler
# deploy` natijasida chiqadi). Deploy qilgach shu qiymatni yangilang.
APP_URL = "https://mindhubuz.workers.dev"
